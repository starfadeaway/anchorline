name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  eval-regression:
    # 只读 data/eval 已入库产物；不需要 MySQL / dataset / API key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Eval artifacts check
        run: python scripts/eval_regression.py

  e2e:
    # 前端 e2e：MySQL service + 本地 API（不调模型，不需要 provider key）+ Playwright
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: anchorline
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Configure env
        run: |
          printf '%s\n' \
            ANCHORLINE_MYSQL_HOST=127.0.0.1 \
            ANCHORLINE_MYSQL_PORT=3306 \
            ANCHORLINE_MYSQL_DATABASE=anchorline \
            ANCHORLINE_MYSQL_USER=root \
            ANCHORLINE_MYSQL_PASSWORD=root \
            ANCHORLINE_DEEPSEEK_API_KEY=dummy-for-e2e \
            ANCHORLINE_SILICONFLOW_API_KEY=dummy-for-e2e \
            ANCHORLINE_LOREKEEPER_ENABLED=false > .env
      - name: Migrate
        run: alembic upgrade head
      - name: Start API
        run: |
          nohup uvicorn anchorline.api.main:app --host 127.0.0.1 --port 8000 >/tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        working-directory: frontend
        run: npm run e2e

  # 本地 self-hosted runner（Windows）：用本机 MySQL，不需要 services 容器。
  # 需要 runner 进程环境里提供 ANCHORLINE_MYSQL_PASSWORD（本机 MySQL 密码）。
  e2e-local:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, Windows, e2e]
    env:
      ANCHORLINE_MYSQL_HOST: "127.0.0.1"
      ANCHORLINE_MYSQL_PORT: "3306"
      ANCHORLINE_MYSQL_DATABASE: "anchorline"
      ANCHORLINE_MYSQL_USER: "root"
      ANCHORLINE_MYSQL_PASSWORD: "placeholder-local-password"
      ANCHORLINE_LOREKEEPER_ENABLED: "false"
      ANCHORLINE_DEEPSEEK_API_KEY: "dummy-for-e2e"
      ANCHORLINE_SILICONFLOW_API_KEY: "dummy-for-e2e"
    steps:
      - uses: actions/checkout@v4
      - name: Install backend
        run: |
          D:\Python3135\python.exe -m pip install --upgrade pip
          D:\Python3135\python.exe -m pip install -e ".[dev]"
      - name: Migrate (local MySQL)
        run: D:\Python3135\python.exe -m alembic upgrade head
      - name: Start API
        run: |
          $env:PYTHONPATH = "src"
          Start-Process -FilePath "D:\Python3135\python.exe" -ArgumentList "-m","uvicorn","anchorline.api.main:app","--host","127.0.0.1","--port","8000"
          Start-Sleep -Seconds 10
          curl.exe -s -f http://127.0.0.1:8000/health
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install chromium
      - name: Run e2e
        working-directory: frontend
        run: npm run e2e

  # 本地：启动 API（uvicorn）后 cd frontend && npm run e2e

