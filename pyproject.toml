[project]
name = "anchorline"
version = "0.1.0"
description = "Budgeted memory layer for multi-turn dialogue and agent trajectories, evaluated on LongMemEval-V2 web and LongMemEval-S knowledge-update."
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "mcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pymysql>=1.1",
    "langgraph>=0.2.60",
    "lancedb>=0.17",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "httpx>=0.28",
    "openai>=1.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]  # 基础错误 + import 排序
ignore = ["E501"]  # 行宽交给 formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # 测试里 sys.path 调整后的 import
"scripts/*" = ["E402"]  # 脚本先 sys.path.insert 再 import anchorline
