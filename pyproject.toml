[project]
name = "anchorline"
version = "0.1.0"
description = "Budgeted memory layer for multi-turn dialogue and agent trajectories, evaluated on LongMemEval-V2 web and LongMemEval-S knowledge-update."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pymysql>=1.1",
    "langgraph>=0.2.60",
    "lancedb>=0.17",
    "rank-bm25>=0.2.2",
    "httpx>=0.28",
    "openai>=1.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
